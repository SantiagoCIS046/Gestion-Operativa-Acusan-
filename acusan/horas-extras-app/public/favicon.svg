<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Drop Gradients -->
    <linearGradient id="dropGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <linearGradient id="dropCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="dropYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00589b" />
      <stop offset="100%" stop-color="#003566" />
    </linearGradient>
  </defs>

  <!-- Outer Lime Green Circle Ring -->
  <circle cx="60" cy="60" r="58" fill="#73be28" />
  
  <!-- Deep Blue Inner Circle -->
  <circle cx="60" cy="60" r="53" fill="url(#bgCircle)" stroke="#73be28" stroke-width="2.5" />

  <!-- Top Left Green Leaf Drop -->
  <path d="M49 44 C49 37, 56 30, 56 30 C56 30, 63 37, 63 44 C63 48.5, 59.5 52, 56 52 C52.5 52, 49 48.5, 49 44 Z" fill="url(#dropGreen)" />

  <!-- Right Cyan Water Drop -->
  <path d="M64 47 C64 38, 77 31, 77 31 C77 31, 90 38, 90 47 C90 54, 84 60, 77 60 C70 60, 64 54, 64 47 Z" fill="url(#dropCyan)" />

  <!-- Bottom Left Gold/Yellow Drop -->
  <path d="M40 54 C40 47, 51 40, 51 40 C51 40, 62 47, 62 54 C62 61, 56.5 66, 51 66 C45.5 66, 40 61, 40 54 Z" fill="url(#dropYellow)" />

  <!-- White Splash Waves -->
  <path d="M30 63 C36 56, 41 61, 41 61 C41 61, 35 66, 30 63 Z" fill="#ffffff" opacity="0.9" />
  <path d="M90 63 C84 56, 79 61, 79 61 C79 61, 85 66, 90 63 Z" fill="#ffffff" opacity="0.9" />

  <!-- Acuasan Text -->
  <text x="60" y="82" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="-0.8">acuasan</text>
  
  <!-- 100% Sangileña Subtext -->
  <text x="60" y="93" font-family="'Inter', sans-serif" font-weight="800" font-size="8" fill="#38bdf8" text-anchor="middle">1<tspan fill="#73be28">00</tspan>% <tspan fill="#ffffff">Sangileña</tspan></text>
</svg>